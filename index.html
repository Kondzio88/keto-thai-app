<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Keto Thai App</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./src/styles/main.css" />
    </head>
    <body>
        <!-- BOTTOM TAB BAR (PWA Navigation) -->

        <nav class="tabbar" id="tabbar" aria-label="Main">
            <a class="tabbar__link tabbar__link--active" href="/" data-link>
                <i data-lucide="home" class="tabbar__icon"></i>
                <span class="tabbar__label">Home</span>
            </a>
            <a class="tabbar__link" href="/dashboard" data-link>
                <i data-lucide="activity" class="tabbar__icon"></i>
                <span class="tabbar__label">Tracker</span>
            </a>
            <a class="tabbar__link" href="/recipes" data-link>
                <i data-lucide="chef-hat" class="tabbar__icon"></i>
                <span class="tabbar__label">Przepisy</span>
            </a>
            <a class="tabbar__link" href="/knowledge" data-link>
                <i data-lucide="book-open" class="tabbar__icon"></i>
                <span class="tabbar__label">Wiedza</span>
            </a>
            <a class="tabbar__link" href="/camp" data-link>
                <i data-lucide="swords" class="tabbar__icon"></i>
                <span class="tabbar__label">Camp</span>
            </a>
        </nav>

        <!-- MAIN APP DIV  -->

        <div id="app"></div>
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
